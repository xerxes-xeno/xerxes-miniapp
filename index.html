<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>XERXES Trainer Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #202020 0%, #0b0b0b 45%, #050505 100%);
            color: white;
            min-height: 100vh;
            padding: 18px;
        }

        .app {
            max-width: 500px;
            margin: auto;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .subtitle {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* TRAINER CARD */

        .trainer-card {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            padding: 22px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.09),
                    rgba(255,255,255,0.025)
                );
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow:
                0 20px 50px rgba(0,0,0,0.55);
        }

        .trainer-card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            top: -80px;
            right: -60px;
        }

        /* AVATAR */

        .avatar-area {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .avatar {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            background: #171717;
            border: 2px solid rgba(255,255,255,0.25);
        }

        .trainer-name {
            font-size: 22px;
            font-weight: 800;
        }

        .trainer-id {
            margin-top: 5px;
            color: #999;
            font-size: 12px;
        }

        /* DETAILS */

        .details {
            margin-top: 25px;
            display: grid;
            gap: 11px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-radius: 13px;
            background: rgba(255,255,255,0.045);
        }

        .label {
            color: #999;
            font-size: 13px;
        }

        .value {
            font-size: 14px;
            font-weight: 700;
        }

        /* STARTER */

        .starter {
            margin-top: 18px;
            padding: 15px;
            border-radius: 16px;
            background: rgba(255,255,255,0.055);
            text-align: center;
        }

        .starter-title {
            color: #999;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 7px;
        }

        .starter-name {
            font-size: 18px;
            font-weight: 800;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 18px;
        }

        .stat {
            text-align: center;
            padding: 15px 8px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
        }

        .stat-number {
            font-size: 21px;
            font-weight: 900;
        }

        .stat-label {
            margin-top: 5px;
            color: #888;
            font-size: 10px;
        }

        /* PASSES */

        .passes {
            margin-top: 20px;
        }

        .section-title {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .pass {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 15px;
            background: rgba(255,255,255,0.055);
        }

        .pass-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pass-icon {
            font-size: 25px;
        }

        .pass-name {
            font-weight: 800;
            font-size: 14px;
        }

        .pass-status {
            color: #777;
            font-size: 10px;
            margin-top: 3px;
        }

        .arrow {
            color: #777;
            font-size: 18px;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            color: #666;
            font-size: 10px;
            margin-top: 22px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">
        <div class="logo">XERXES</div>
        <div class="subtitle">TRAINER PROFILE</div>
    </div>


    <!-- TRAINER CARD -->

    <div class="trainer-card">

        <div class="avatar-area">

            <div class="avatar">
                🎓
            </div>

            <div>
                <div class="trainer-name">
                    XENO
                </div>

                <div class="trainer-id">
                    XRX-8504230656
                </div>
            </div>

        </div>


        <!-- DETAILS -->

        <div class="details">

            <div class="detail">
                <span class="label">🏠 Hometown</span>
                <span class="value">Alola</span>
            </div>

            <div class="detail">
                <span class="label">🎖️ Trainer Level</span>
                <span class="value">1</span>
            </div>

        </div>


        <!-- STARTER -->

        <div class="starter">

            <div class="starter-title">
                STARTER POKÉMON
            </div>

            <div class="starter-name">
                🌱 Bulbasaur
            </div>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">
                <div class="stat-number">
                    0
                </div>

                <div class="stat-label">
                    WINS
                </div>
            </div>


            <div class="stat">
                <div class="stat-number">
                    0
                </div>

                <div class="stat-label">
                    LOSSES
                </div>
            </div>


            <div class="stat">
                <div class="stat-number">
                    0
                </div>

                <div class="stat-label">
                    BADGES
                </div>
            </div>

        </div>


        <!-- PASSES -->

        <div class="passes">

            <div class="section-title">
                TRAINER PASSES
            </div>


            <div class="pass">

                <div class="pass-left">

                    <div class="pass-icon">
                        🎟️
                    </div>

                    <div>
                        <div class="pass-name">
                            X PASS
                        </div>

                        <div class="pass-status">
                            Batches coming soon
                        </div>
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </div>


            <div class="pass">

                <div class="pass-left">

                    <div class="pass-icon">
                        💎
                    </div>

                    <div>
                        <div class="pass-name">
                            X PRIME PASS
                        </div>

                        <div class="pass-status">
                            Batches coming soon
                        </div>
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </div>

        </div>

    </div>


    <div class="footer">
        XERXES • POKÉMON TRAINER SYSTEM
    </div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    async function loadProfile() {

        try {

            const response = await fetch(
                "https://telegram-bot-production-53dc.up.railway.app/api/profile",
                {
                    headers: {
                        "X-Telegram-Init-Data": tg.initData
                    }
                }
            );

            const data = await response.json();

            if (data.error) {
                console.error(data.error);
                return;
            }

            // NAME
            document.querySelector(".trainer-name").textContent =
                data.name || "Unknown";

            // TRAINER ID
            document.querySelector(".trainer-id").textContent =
                data.trainer_id || "Unknown";

            // HOMETOWN
            document.querySelector(".detail:nth-child(1) .value").textContent =
                data.hometown || "Unknown";

            // STARTER
            document.querySelector(".starter-name").textContent =
                "🌱 " + (data.starter || "Not selected");

            // WINS
            document.querySelectorAll(".stat-number")[0].textContent =
                data.wins ?? 0;

            // LOSSES
            document.querySelectorAll(".stat-number")[1].textContent =
                data.losses ?? 0;

            // BADGES
            document.querySelectorAll(".stat-number")[2].textContent =
                data.badges ?? 0;

        } catch (error) {

            console.error(
                "Profile loading failed:",
                error
            );

        }
    }

    loadProfile();
</script>
    
</body>
  </html>
